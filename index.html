<style>
:root{--bg:#eef0f2;--sf:#fff;--tx:#1b2430;--mu:#5d6773;--ln:#d5dae0;--ac:#24506f;--at:#fff;--as:#e1ebf2;--dg:#b3261e;--ok:#1e7a46;--wn:#8a5a00;--r:6px}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#12171c;--sf:#1b222a;--tx:#e6ebf0;--mu:#97a3af;--ln:#2f3944;--ac:#6cb2e0;--at:#0c1319;--as:#20323f;--dg:#ff8a80;--ok:#6fd39b;--wn:#f0b45a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,"Segoe UI",Roboto,sans-serif}
h1{font-size:1.35rem;margin:0 0 .4rem}h2{font-size:1.02rem;margin:.2rem 0 .6rem}.mu{color:var(--mu)}
.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}
.side{background:var(--sf);border-right:1px solid var(--ln);padding:1rem .7rem}
.brand{font-weight:700;font-size:1.1rem;padding:.2rem .6rem 1rem}
.grp{font-size:.78rem;color:var(--mu);font-weight:600;padding:.9rem .6rem .25rem}
.side a{display:block;padding:.5rem .7rem;border-radius:var(--r);color:var(--tx);text-decoration:none}
.side a:hover{background:var(--as)}.side a[aria-current=page]{background:var(--ac);color:var(--at);font-weight:600}
main{padding:1.4rem;max-width:1150px;width:100%}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:var(--r);padding:1rem;margin-bottom:1rem}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:1rem;flex-wrap:wrap;margin-bottom:.8rem}
.g4{display:grid;gap:.8rem;grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
button{font:inherit;padding:.45rem .9rem;border-radius:var(--r);border:1px solid var(--ln);background:var(--sf);color:var(--tx);cursor:pointer;min-height:40px}
button:hover{border-color:var(--ac)}button.primary{background:var(--ac);color:var(--at);border-color:var(--ac);font-weight:600}
button.danger{color:var(--dg)}button.sm{min-height:32px;padding:.2rem .6rem}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
input,select,textarea{font:inherit;width:100%;padding:.45rem .55rem;border:1px solid var(--ln);border-radius:var(--r);background:var(--bg);color:var(--tx);min-height:40px}
label{display:block;font-weight:600;margin-bottom:.2rem}.field{margin-bottom:.8rem}.er{color:var(--dg);font-size:.85rem;min-height:1.1em}
.tb{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{padding:.45rem .5rem;border-bottom:1px solid var(--ln);text-align:left;white-space:nowrap}
th{font-size:.82rem;color:var(--mu)}td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}td.ac{text-align:right}td input,td select{min-height:34px;padding:.25rem .4rem}
.vz{padding:1.6rem;text-align:center;color:var(--mu)}.wn{color:var(--wn);font-size:.88rem;margin:.2rem 0}
.tot{font-size:1.5rem;font-weight:700;font-variant-numeric:tabular-nums}
dialog{border:1px solid var(--ln);border-radius:var(--r);background:var(--sf);color:var(--tx);padding:1.2rem;width:min(460px,92vw)}dialog::backdrop{background:rgba(0,0,0,.45)}
.rd{display:flex;justify-content:flex-end;gap:.5rem;margin-top:1rem}
#av{position:fixed;right:1rem;bottom:1rem;display:flex;flex-direction:column;gap:.5rem;z-index:20}.avs{background:var(--tx);color:var(--bg);padding:.6rem .9rem;border-radius:var(--r);max-width:340px}.avs.e{background:var(--dg);color:#fff}
#imp{display:none}.pimg{width:270px;height:270px;border:1px solid var(--ln);border-radius:var(--r);display:grid;place-items:center;background:#fff;overflow:hidden;flex:none}.pimg img{max-width:100%;max-height:100%;object-fit:contain}.bd{display:inline-block;background:var(--as);border:1px solid var(--ln);border-radius:4px;padding:0 .35rem;margin:0 .15rem .15rem 0;font-variant-numeric:tabular-nums}.pb{break-after:page}.seg{display:inline-flex;gap:.3rem;margin-right:.5rem}.seg .on{background:var(--ac);color:var(--at);border-color:var(--ac)}@media print{#imp .bd{background:none;border:1px solid #000}#imp .np{display:none}}
@media (max-width:760px){.app{grid-template-columns:1fr}.side{border-right:0;border-bottom:1px solid var(--ln)}main{padding:1rem}}
@media print{.app,#av,dialog,#bkbar{display:none!important}#imp{display:block;color:#000;background:#fff}#imp table{font-size:12px}tr{break-inside:avoid}@page{size:A4;margin:12mm}}

<script>
"use strict";
const $=(s,e=document)=>e.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const brl=n=>new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"}).format(Number(n)||0);
const nf=(n,d=3)=>(Number(n)||0).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d});
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);
const hoje=()=>new Date().toLocaleDateString("pt-BR");
function aviso(m,e){const el=document.createElement("div");el.className="avs"+(e?" e":"");el.textContent=m;$("#av").appendChild(el);setTimeout(()=>el.remove(),e?6000:3000)}
const novo=()=>({schema:2,perfis:[],acessorios:[],vidros:[],produtos:[],orcamentos:[],config:{custoKg:42,mkp:2.1,empresa:"SmartPAV",validade:10,minKg:100}});
let D=novo();const KEY="smartpav:v2";
const IMG_DB="smartpav_images_v1",IMG_STORE="images",IMG_URLS={};
let imgDb;
function abrirBancoImagens(){return new Promise((resolve,reject)=>{const r=indexedDB.open(IMG_DB,1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains(IMG_STORE))db.createObjectStore(IMG_STORE,{keyPath:"id"})};r.onsuccess=()=>{imgDb=r.result;resolve(imgDb)};r.onerror=()=>reject(r.error||new Error("IndexedDB indisponível"))})}
function imgTx(mode,fn){return new Promise((resolve,reject)=>{const tx=imgDb.transaction(IMG_STORE,mode),store=tx.objectStore(IMG_STORE);try{fn(store)}catch(e){reject(e);return}tx.oncomplete=()=>resolve(true);tx.onerror=()=>reject(tx.error||new Error("Falha no banco de imagens"));tx.onabort=()=>reject(tx.error||new Error("Operação cancelada"))})}
function guardarImagem(id,blob){return imgTx("readwrite",s=>s.put({id,blob,at:Date.now()}))}
function obterImagem(id){return new Promise((resolve,reject)=>{const r=imgDb.transaction(IMG_STORE,"readonly").objectStore(IMG_STORE).get(id);r.onsuccess=()=>resolve(r.result||null);r.onerror=()=>reject(r.error)})}
function excluirImagem(id){return imgTx("readwrite",s=>s.delete(id))}
function dataURLBlob(data){return fetch(data).then(r=>r.blob())}
function urlImagem(id){return id?IMG_URLS[id]||"":""}
function thumbPerfil(c,s=42){const u=c&&c.imgKey?urlImagem(c.imgKey):"";return u?`<img src="${esc(u)}" alt="" style="width:${s}px;height:${s}px;object-fit:contain;vertical-align:middle;margin-right:.45rem;border-radius:4px;background:#fff">`:""}
function salvar(){try{const d=JSON.parse(JSON.stringify(D));d.produtos.forEach(p=>delete p.img);localStorage.setItem(KEY,JSON.stringify(d));return true}catch(e){aviso("Não foi possível salvar os dados. Exporte um backup agora.",1);return false}}
async function carregarImagens(){for(const p of D.perfis){if(p.img){const id=p.imgKey||uid();await guardarImagem(id,await dataURLBlob(p.img));p.imgKey=id;delete p.img;salvar()}}for(const p of D.perfis){if(p.imgKey&&!IMG_URLS[p.imgKey]){const rec=await obterImagem(p.imgKey);if(rec&&rec.blob)IMG_URLS[p.imgKey]=URL.createObjectURL(rec.blob);else{delete p.imgKey;salvar()}}}for(const p of D.produtos){if(p.img){const id=p.imgKey||uid();await guardarImagem(id,await dataURLBlob(p.img));p.imgKey=id;delete p.img;salvar()}}for(const p of D.produtos){if(p.imgKey&&!IMG_URLS[p.imgKey]){const rec=await obterImagem(p.imgKey);if(rec&&rec.blob)IMG_URLS[p.imgKey]=URL.createObjectURL(rec.blob);else{delete p.imgKey;salvar()}}}}
async function iniciar(){try{await abrirBancoImagens();await carregarImagens();render()}catch(e){aviso("Não foi possível abrir o banco de imagens. Use um navegador compatível e tente novamente.",1);render()}}
function migrar(o){
 if(o&&o.schema===2){const d=Object.assign(novo(),o);d.config=Object.assign(novo().config,o.config||{});d.perfis.forEach(x=>{if(!x.barra)x.barra=6050});d.produtos.forEach(x=>{if(x.img&&!/^data:image\/(webp|jpeg|png);base64,[A-Za-z0-9+\/=]+$/.test(x.img))delete x.img});return d}
 if(!o||!("SmartPavPerfis" in o||"SmartPavAcessorios" in o||"SmartPavVidros" in o||"SmartPavOrcamentos" in o))throw new Error("formato");
 const J=k=>{try{return JSON.parse(o[k])||[]}catch(e){return[]}};
 const P=J("SmartPavPerfis"),A=J("SmartPavAcessorios"),V=J("SmartPavVidros"),O=J("SmartPavOrcamentos"),d=novo(),rel=[];
 const fx=f=>{f=String(f).trim();if(!f.includes("/1000"))f=f.replace(/L/g,"l").replace(/A/g,"a");return f.replace(/([LAla\d)])\s*[xX]\s*(?=[\dLAla(])/g,"$1*")};
 d.produtos=[...new Set([...P,...A,...V].map(x=>x.prod))].map(n=>({id:uid(),nome:n,perfis:[],acessorios:[],vidros:[]}));
 const pr=n=>d.produtos.find(p=>p.nome===n),dsc={};
 P.forEach(p=>{if(p.desc!=="NOVO PERFIL")dsc[p.perfil+p.uso]=p.desc});
 const t=P.filter(p=>p.perfil==="EX9999");if(t.length)rel.push("Perfil de teste EX9999 (Janela de correr) não foi migrado.");
 P.filter(p=>p.perfil!=="EX9999").forEach(p=>{
  let c=d.perfis.find(x=>x.codigo===p.perfil);if(!c){c={id:uid(),codigo:p.perfil,peso:p.peso,barra:6050};d.perfis.push(c)}
  const nd=p.desc==="NOVO PERFIL"&&dsc[p.perfil+p.uso];if(nd)rel.push("Descrição de "+p.prod+" / "+p.perfil+" preenchida como "+nd+".");
  pr(p.prod).perfis.push({perfilId:c.id,desc:nd||p.desc,uso:p.uso,desconto:p.desconto||0,divisor:p.divisor||1,qtd:String(p.formulaQtd)})});
 const pf=P.find(p=>p.perfil!=="EX9999");if(pf)d.config.custoKg=pf.custo;
 A.forEach(x=>{const ds=x.desc.trim(),cu=Number(x.custo)||0;let c=d.acessorios.find(y=>y.desc===ds&&y.custo===cu);
  if(!c){c={id:uid(),codigo:"AC-"+String(d.acessorios.length+1).padStart(3,"0"),desc:ds,custo:cu};d.acessorios.push(c)}
  const f=fx(x.formulaQtd);if(f!==String(x.formulaQtd).trim())rel.push("Fórmula de "+ds+" ("+x.prod+"): "+x.formulaQtd.trim()+" → "+f);
  pr(x.prod).acessorios.push({acId:c.id,qtd:f})});
 V.forEach(x=>{let c=d.vidros.find(y=>y.tipo===x.desc&&y.custo===x.custo);if(!c){c={id:uid(),tipo:x.desc,custo:x.custo};d.vidros.push(c)}
  pr(x.prod).vidros.push({vidroId:c.id,descL:x.descL||0,divL:x.divL||1,descA:x.descA||0,divA:x.divA||1,qtd:String(x.formulaQtd)})});
 d.orcamentos=O.map(q=>({id:uid(),numero:q.numero,cliente:q.cliente,local:q.local,car:q.obsCaracteristicas,pag:q.obsPagamento,ent:q.obsEntrega,data:q.data,total:q.totalGeral,
  itens:q.itens.map(i=>({produto:i.produto,largura:i.largura,altura:i.altura,quantidade:i.quantidade,mkp:i.fatorMkp,custoUnit:i.unitarioCusto,unitarioVenda:i.unitarioVenda,total:i.total,av:[]}))}));
 d.relatorio=rel;return d}
try{const b=localStorage.getItem(KEY);if(b)D=migrar(JSON.parse(b));else{const o={};["Perfis","Acessorios","Vidros","Orcamentos"].forEach(k=>{const v=localStorage.getItem("SmartPav"+k);if(v)o["SmartPav"+k]=v});if(Object.keys(o).length){D=migrar(o);salvar()}}}catch(e){aviso("Não foi possível ler os dados salvos.",1)}

function ev(f,l,a){let s=String(f).trim().replace(/([LAla\d)])\s*[xX]\s*(?=[\dLAla(])/g,"$1*");
 s=s.replace(/[LAla]/g,c=>"("+({l:l,a:a,L:l*1000,A:a*1000}[c]).toFixed(6)+")");
 if(!s||!/^[\d\s+\-*/().]+$/.test(s))return{e:1,v:0};
 try{const v=Function('"use strict";return ('+s+')')();return isFinite(v)?{v}:{e:1,v:0}}catch(x){return{e:1,v:0}}}
const gP=id=>D.perfis.find(x=>x.id===id),gA=id=>D.acessorios.find(x=>x.id===id),gV=id=>D.vidros.find(x=>x.id===id);
const qi=v=>Math.trunc(v+1e-9);
function custo(p,l,a,ck,vid){const av=new Set();let tp=0,ta=0,tv=0;
 if(!p||!(p.perfis.length+p.acessorios.length+p.vidros.length))av.add("Produto sem composição cadastrada.");
 else{
 p.perfis.forEach(x=>{const c=gP(x.perfilId);if(!c){av.add("Perfil removido do cadastro.");return}
  const q=ev(x.qtd,l,a);if(q.e)av.add("Quantidade inválida em "+c.codigo+": "+x.qtd);
  const m=((x.uso==="L"?l:a)-(+x.desconto||0))/(+x.divisor||1);
  if(m<=0)av.add("Corte ≤ 0 em "+c.codigo+".");else if(m*1000>6050)av.add("Peça "+c.codigo+" de "+Math.round(m*1000)+" mm maior que a barra de 6050 mm.");
  tp+=c.peso*Math.max(m,0)*qi(q.v)*(ck==null?D.config.custoKg:ck)});
 p.acessorios.forEach(x=>{const c=gA(x.acId);if(!c){av.add("Acessório removido do cadastro.");return}
  const q=ev(x.qtd,l,a);if(q.e)av.add("Quantidade inválida em "+c.desc+": "+x.qtd);else if(q.v<=0)av.add("Quantidade zero em "+c.desc+".");ta+=c.custo*q.v});
 p.vidros.forEach(x=>{const c=gV(vid||x.vidroId);if(!c){av.add("Vidro removido do cadastro.");return}
  const w=(l-(+x.descL||0))/(+x.divL||1),h=(a-(+x.descA||0))/(+x.divA||1),q=ev(x.qtd,l,a);
  if(q.e)av.add("Quantidade inválida no vidro "+c.tipo+".");
  if(w<=0||h<=0)av.add("Medida pequena demais para o vidro "+c.tipo+" (vão do vidro ≤ 0).");else tv+=c.custo*w*h*qi(q.v)})}
 return{tp,ta,tv,u:tp+ta+tv,av:[...av]}}

const dlg=$("#dlg");function abrir(h){dlg.innerHTML=h;if(!dlg.open)dlg.showModal()}function fechar(){if(dlg.open)dlg.close()}
function confirmar(m,b="Confirmar"){return new Promise(r=>{abrir(`<p>${esc(m)}</p><div class="rd"><button id="n">Cancelar</button><button class="primary danger" id="s">${esc(b)}</button></div>`);$("#n").onclick=()=>{fechar();r(false)};$("#s").onclick=()=>{fechar();r(true)};dlg.oncancel=()=>r(false)})}

const CAD={
 perfis:{t:"Perfis",un:"perfil",lista:()=>D.perfis,campos:[["codigo","Código","t"],["peso","Peso (kg/m)","n"],["barra","Barra (mm)","n"]],uso:(p,id)=>p.perfis.some(x=>x.perfilId===id)},
 acessorios:{t:"Acessórios",un:"acessório",lista:()=>D.acessorios,campos:[["codigo","Código","t"],["desc","Descrição","t"],["custo","Custo (R$)","n"]],uso:(p,id)=>p.acessorios.some(x=>x.acId===id)},
 vidros:{t:"Vidros",un:"vidro",lista:()=>D.vidros,campos:[["tipo","Tipo","t"],["custo","Custo por m² (R$)","n"]],uso:(p,id)=>p.vidros.some(x=>x.vidroId===id)}};
let busca="";
function cadView(k){const C=CAD[k],q=busca.trim().toLowerCase();
 const L=C.lista().filter(r=>!q||C.campos.some(c=>String(r[c[0]]).toLowerCase().includes(q)));
 return `<div class="head"><h1>${C.t}</h1><button class="primary" data-a="cnovo" data-k="${k}">Novo ${C.un}</button></div>
 <div class="field"><input id="busca" type="search" placeholder="Buscar" aria-label="Buscar" value="${esc(busca)}" style="max-width:320px"></div>
 <div class="panel tb">${L.length?`<table><thead><tr>${k==="perfis"?"<th>Imagem</th>":""}${C.campos.map(c=>`<th class="${c[2]==="n"?"n":""}">${c[1]}</th>`).join("")}<th></th></tr></thead><tbody>${L.map(r=>`<tr>${k==="perfis"?`<td>${thumbPerfil(r,48)}</td>`:""}${C.campos.map(c=>`<td class="${c[2]==="n"?"n":""}">${c[2]==="n"?(c[0]==="peso"?nf(r[c[0]]):c[0]==="barra"?(r[c[0]]||0)+" mm":brl(r[c[0]])):esc(r[c[0]])}</td>`).join("")}<td class="ac"><button class="sm" data-a="ced" data-k="${k}" data-id="${r.id}">Editar</button> <button class="sm danger" data-a="cdel" data-k="${k}" data-id="${r.id}">Excluir</button></td></tr>`).join("")}</tbody></table>`:`<div class="vz">${C.lista().length?"Nada encontrado.":"Nenhum item cadastrado. Cadastre o primeiro."}</div>`}</div>`}
let cadPerfilImgId=null,cadPerfilR=null;function cadEditar(k,id){const C=CAD[k],r=id?C.lista().find(x=>x.id===id):{id:uid()};cadPerfilImgId=k==="perfis"?r.id:null;cadPerfilR=k==="perfis"?r:null;
 abrir(`<form id="f" novalidate><h2>${id?"Editar":"Novo"} ${C.un}</h2>${C.campos.map(c=>`<div class="field"><label for="f-${c[0]}">${c[1]} *</label><input id="f-${c[0]}" ${c[2]==="n"?'type="number" inputmode="decimal" step="any" min="0"':'type="text"'} value="${esc(r[c[0]]??(c[0]==="barra"?6050:""))}"><div class="er" id="e-${c[0]}"></div></div>`).join("")}${k==="perfis"?`<div class="field"><label>Imagem do perfil</label><div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap"><div id="pfprev" style="width:100px;height:70px;border:1px solid #ddd;border-radius:6px;display:flex;align-items:center;justify-content:center;background:#fff;overflow:hidden">${r.imgKey&&urlImagem(r.imgKey)?`<img src="${esc(urlImagem(r.imgKey))}" style="max-width:100%;max-height:100%;object-fit:contain">`:`<span class="mu">Sem imagem</span>`}</div><div><button type="button" class="sm" data-a="pfimg">${r.imgKey?"Trocar imagem":"Adicionar imagem"}</button> ${r.imgKey?`<button type="button" class="sm danger" data-a="pfimgdel">Remover</button>`:""}<input id="pfimgf" type="file" accept="image/*" hidden></div></div><p class="mu">A imagem aparecerá nos relatórios que listam perfis.</p></div>`:""}<div class="rd"><button type="button" id="x">Cancelar</button><button class="primary" type="submit">Salvar ${C.un}</button></div></form>`);
 dlg.querySelector("input").focus();$("#x").onclick=fechar;
 $("#f").onsubmit=e=>{e.preventDefault();let ok=true;const n={id:r.id,...(k==="perfis"&&r.imgKey?{imgKey:r.imgKey}:{})};
  C.campos.forEach(c=>{const v=$("#f-"+c[0]).value.trim();$("#e-"+c[0]).textContent="";

async function cadExcluir(k,id){const C=CAD[k],r=C.lista().find(x=>x.id===id);if(!r)return;

const Cart={itens:[],edit:null,num:"",cliente:"",local:"",car:"",pag:"",ent:"",f:{p:"",l:"1.000",a:"1.000",q:"1",m:null},cur:null};
function calcF(){const p=D.produtos.find(x=>x.id===Cart.f.p),l=parseFloat(Cart.f.l)||0,a=parseFloat(Cart.f.a)||0,q=parseInt(Cart.f.q)||1,m=parseFloat(Cart.f.m)||1;
 const cor=D.cores.find(x=>x.id===Cart.f.c)||D.cores[0],c=custo(p,l,a,cor&&cor.custoKg,Cart.f.v||"");c.cor=cor;c.vd=Cart.f.v?gV(Cart.f.v):null;c.p=p;c.l=l;c.a=a;c.q=q;c.m=m;c.uv=Math.round(c.u*m*100)/100;Cart.cur=c;return c}

 const inp=(id,l,v,ex="")=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="number" step="any" inputmode="decimal" value="${esc(v)}" ${ex}></div>`;
 return `<div class="head"><h1>Novo orçamento</h1></div>${C.edit?`<div class="panel">Editando o orçamento <b>#${esc(C.num)}</b> de ${esc(C.cliente)}. <button class="sm" data-a="ocancel">Cancelar edição</button></div>`:""}

 <div class="panel tb"><h2>Itens do orçamento</h2>${C.itens.length?`<table><thead><tr><th>#</th><th>Produto</th><th>Medidas (L × A)</th><th>Qtd</th><th>MKP</th><th class="n">Venda unit.</th><th class="n">Total</th><th></th></tr></thead><tbody>${C.itens.map((i,n)=>`<tr><td>${n+1}</td><td>${thumb(i.produto)}<b>${esc(i.produto)}</b>${descItem(i)}${(i.av||[]).map(w=>`<div class="wn">⚠ ${esc(w)}</div>`).join("")}</td><td>${nf(i.largura)} × ${nf(i.altura)} m</td><td><input data-i="${n}" data-k="quantidade" type="number" min="1" value="${i.quantidade}" style="width:70px"></td><td><input data-i="${n}" data-k="mkp" type="number" step="0.05" value="${i.mkp}" style="width:80px"></td><td class="n">${brl(i.unitarioVenda)}</td><td class="n"><b>${brl(i.total)}</b></td><td class="ac"><button class="sm danger" data-a="orem" data-i="${n}">Remover</button></td></tr>`).join("")}</tbody></table>`:`<div class="vz">Nenhum item adicionado ainda.</div>`}</div>
 <div class="panel"><div class="g4"><div class="field"><label for="c-num">Nº do orçamento *</label><input id="c-num" value="${esc(C.num)}" ${C.edit?"disabled":""}></div><div class="field"><label for="c-cliente">Cliente / projeto *</label><input id="c-cliente" value="${esc(C.cliente)}"></div><div class="field"><label for="c-local">Local da obra</label><input id="c-local" value="${esc(C.local)}"></div></div>
 <div class="g4"><div class="field"><label for="c-car">Características das esquadrias</label><textarea id="c-car" rows="3">${esc(C.car)}</textarea></div><div class="field"><label for="c-pag">Condições de pagamento</label><textarea id="c-pag" rows="3">${esc(C.pag)}</textarea></div><div class="field"><label for="c-ent">Entrega / instalação</label><textarea id="c-ent" rows="3">${esc(C.ent)}</textarea></div></div>

function resetCart(){Object.assign(Cart,{itens:[],edit:null,num:"",cliente:"",local:"",car:"",pag:"",ent:""})}
function salvarOrc(){const C=Cart,num=C.num.trim(),cli=C.cliente.trim();
 if(!num||!cli){aviso("Preencha o número do orçamento e o cliente.",1);return}
 if(!C.itens.length){aviso("Adicione ao menos um item antes de salvar.",1);return}
 if(!C.edit&&D.orcamentos.some(o=>o.numero===num)){aviso("Já existe um orçamento com o número "+num+".",1);return}
 const o={id:C.edit||uid(),numero:num,cliente:cli,local:C.local.trim(),car:C.car,pag:C.pag,ent:C.ent,data:C.dataOrig||hoje(),itens:JSON.parse(JSON.stringify(C.itens)),total:totalCart()};
 const i=D.orcamentos.findIndex(x=>x.id===o.id);if(i>=0)D.orcamentos[i]=o;else D.orcamentos.push(o);
 if(salvar()){aviso("Orçamento "+num+" salvo.");resetCart();render()}}
function salvosView(){const L=D.orcamentos;return `<div class="head"><h1>Orçamentos salvos</h1></div><div class="panel tb">${L.length?`<table><thead><tr><th>Nº</th><th>Cliente</th><th>Local</th><th>Data</th><th>Itens</th><th class="n">Total</th><th></th></tr></thead><tbody>${L.map(o=>`<tr><td><b>#${esc(o.numero)}</b></td><td>${esc(o.cliente)}</td><td>${esc(o.local||"-")}</td><td>${esc(o.data)}</td><td>${o.itens.length}</td><td class="n">${brl(o.total)}</td><td class="ac"><button class="sm" data-a="simp" data-id="${o.id}">Imprimir</button> <button class="sm" data-a="sed" data-id="${o.id}">Editar</button> <button class="sm danger" data-a="sdel" data-id="${o.id}">Excluir</button></td></tr>`).join("")}</tbody></table>`:`<div class="vz">Nenhum orçamento salvo. Monte o primeiro em "Novo orçamento".</div>`}</div>`}
function imprimir(o){const c=D.config;$("#imp").innerHTML=`<h2 style="text-align:center">${esc(c.empresa)} — Orçamento #${esc(o.numero)}</h2><p><b>Cliente / projeto:</b> ${esc(o.cliente)}<br><b>Local:</b> ${esc(o.local||"Não informado")}<br><b>Data:</b> ${esc(o.data)}</p>
 <table><thead><tr><th>#</th><th>Produto</th><th>Medidas (L × A)</th><th>Qtd</th><th class="n">Preço unit.</th><th class="n">Total</th></tr></thead><tbody>${o.itens.map((i,n)=>`<tr><td>${n+1}</td><td><div style="display:flex;align-items:center;gap:.6rem">${thumb(i.produto,64)}<div>${esc(i.produto)}${descItem(i)}</div></div></td><td>${nf(i.largura)} × ${nf(i.altura)} m</td><td>${i.quantidade}</td><td class="n">${brl(i.unitarioVenda)}</td><td class="n">${brl(i.total)}</td></tr>`).join("")}</tbody></table>
 <h3 style="text-align:right">Total: ${brl(o.total)}</h3><p><b>Características:</b> ${esc(o.car||"Esquadrias de alumínio conforme especificações técnicas.")}</p><p><b>Pagamento:</b> ${esc(o.pag||"A combinar.")}</p><p><b>Entrega / instalação:</b> ${esc(o.ent||"No local indicado.")}</p><p>Orçamento válido por ${esc(c.validade)} dias.</p>`;aguardarImagens().then(()=>window.print())}
function configView(){const c=D.config,f=(id,l,v,t="number")=>`<div class="field"><label for="${id}">${l}</label><input id="${id}" type="${t}" ${t==="number"?'step="any" inputmode="decimal"':""} value="${esc(v)}"></div>`;
 return `<div class="head"><h1>Configurações</h1></div><div class="panel" style="max-width:520px">${f("g-empresa","Nome da empresa (cabeçalho do orçamento)",c.empresa,"text")}<p class="mu">O custo do perfil (R$/kg) agora é definido por cor, em Cadastros › Cores dos perfis.</p>${f("g-mkp","Fator de venda padrão (MKP)",c.mkp)}${f("g-validade","Validade do orçamento (dias)",c.validade)}${f("g-minKg","Peso mínimo (kg) de corte para criar cada tamanho de barra especial",c.minKg)}<p class="mu">As alterações são salvas ao sair do campo.</p></div>`}

 <p class="mu">Aceita o backup deste sistema e o backup da versão anterior (os cadastros são separados automaticamente).</p></div>
 ${D.relatorio&&D.relatorio.length?`<div class="panel"><h2>Ajustes feitos na migração — conferir</h2>${D.relatorio.map(r=>`<div class="wn">${esc(r)}</div>`).join("")}</div>`:""}`}

function render(){const r=(location.hash.replace(/^#\/?/,"")||"orcar").split("?")[0],n=views[r]?r:"orcar";
 document.querySelectorAll(".side a").forEach(a=>a.getAttribute("href")==="#/"+n?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
 $("#tela").innerHTML=views[n]();const b=$("#busca");if(b)b.oninput=()=>{busca=b.value;const p=b.selectionStart;render();const x=$("#busca");x.focus();x.setSelectionRange(p,p)}}
window.addEventListener("hashchange",()=>{busca="";render()});

document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a,id=el.dataset.id,k=el.dataset.k,i=+el.dataset.i,l=el.dataset.l,p=D.produtos.find(x=>x.id===prodSel);
 if(a==="cnovo")cadEditar(k);else if(a==="ced")cadEditar(k,id);else if(a==="cdel")cadExcluir(k,id);
 else if(a==="pnovo"){const n=await pedirNome("Novo produto");if(n){const q={id:uid(),nome:n,perfis:[],acessorios:[],vidros:[]};D.produtos.push(q);prodSel=q.id;salvar();render()}}
 else if(a==="pren"&&p){const n=await pedirNome("Renomear produto",p.nome);if(n){p.nome=n;salvar();render()}}
 else if(a==="pdel"&&p){if(await confirmar(`Excluir o produto "${p.nome}" e toda a sua composição?`,"Excluir produto")){D.produtos.splice(D.produtos.indexOf(p),1);salvar();render()}}
 else if(a==="ladd"&&p){const m={perfis:[D.perfis,x=>({perfilId:x.id,desc:"",uso:"L",desconto:0,divisor:1,qtd:"1"})],acessorios:[D.acessorios,x=>({acId:x.id,qtd:"1"})],vidros:[D.vidros,x=>({vidroId:x.id,descL:0,divL:1,descA:0,divA:1,qtd:"1"})]}[l];
  if(!m[0].length){aviso("Cadastre o item no menu Cadastros primeiro.",1);return}p[l].push(m[1](m[0][0]));salvar();render()}
 else if(a==="ldel"&&p){p[l].splice(i,1);salvar();render()}
 else if(a==="oadd"){const c=calcF();if(!c.p){aviso("Cadastre um produto primeiro.",1);return}if(c.l<=0||c.a<=0){aviso("Informe largura e altura válidas.",1);return}
  Cart.itens.push({produto:c.p.nome,largura:c.l,altura:c.a,quantidade:c.q,mkp:c.m,custoUnit:c.u,unitarioVenda:c.uv,total:c.uv*c.q,av:c.av,corId:c.cor?c.cor.id:"",corNome:c.cor?c.cor.nome:"",custoKgCor:c.cor?c.cor.custoKg:null,vidroId:Cart.f.v||"",vidroNome:c.vd?c.vd.tipo:""});render()}
 else if(a==="orem"){Cart.itens.splice(i,1);render()}
 else if(a==="olimpar"){if(await confirmar("Remover todos os itens da lista?","Limpar lista")){Cart.itens=[];render()}}
 else if(a==="osalvar")salvarOrc();else if(a==="ocancel"){resetCart();render()}
 else if(a==="simp")imprimir(D.orcamentos.find(o=>o.id===id));
 else if(a==="sed"){const o=D.orcamentos.find(x=>x.id===id);Object.assign(Cart,{itens:JSON.parse(JSON.stringify(o.itens)),edit:o.id,num:o.numero,cliente:o.cliente,local:o.local||"",car:o.car||"",pag:o.pag||"",ent:o.ent||"",dataOrig:o.data});location.hash="#/orcar"}
 else if(a==="sdel"){const o=D.orcamentos.find(x=>x.id===id);if(await confirmar(`Excluir o orçamento #${o.numero} de ${o.cliente}?`,"Excluir orçamento")){D.orcamentos.splice(D.orcamentos.indexOf(o),1);salvar();render()}}
 else if(a==="exp"){await exportarBackup()}
 else if(a==="imp")$("#arq").click()});
document.addEventListener("input",e=>{const t=e.target,C=Cart;
 if(t.id.startsWith("o-")){C.f[t.id[2]]=t.value;$("#prev").innerHTML=prevHTML()}
 else if(t.id.startsWith("c-"))C[t.id.slice(2)==="num"?"num":t.id.slice(2)]=t.value;
 else if(t.id.startsWith("g-")){const k=t.id.slice(2),v=k==="empresa"?t.value:parseFloat(t.value);if(k==="empresa"||v>=0){D.config[k]=v;salvar()}}});
document.addEventListener("change",async e=>{const t=e.target;
 if(t.id==="psel"){prodSel=t.value;render()}
 else if(t.id==="o-p"){Cart.f.p=t.value;$("#prev").innerHTML=prevHTML()}
 else if(t.dataset.l){const p=D.produtos.find(x=>x.id===prodSel),x=p[t.dataset.l][+t.dataset.i],k=t.dataset.k;x[k]=t.type==="number"?(parseFloat(t.value)||0):t.value;if(k==="divisor"||k==="divL"||k==="divA")x[k]=x[k]||1;salvar();render()}
 else if(t.dataset.k&&t.dataset.i&&Cart.itens[+t.dataset.i]){const it=Cart.itens[+t.dataset.i],v=parseFloat(t.value);
  if(t.dataset.k==="quantidade")it.quantidade=Math.max(1,Math.round(v)||1);else it.mkp=v>0?v:1;

function reduzir(file,max=480){return new Promise((ok,er)=>{const u=URL.createObjectURL(file),im=new Image();im.onload=()=>{try{let w=im.naturalWidth||300,h=im.naturalHeight||300;const s=Math.min(1,max/Math.max(w,h));w=Math.max(1,Math.round(w*s));h=Math.max(1,Math.round(h*s));const c=document.createElement("canvas");c.width=w;c.height=h;const x=c.getContext("2d");x.drawImage(im,0,0,w,h);let d=c.toDataURL("image/webp",.85);if(d.indexOf("data:image/webp")!==0){x.globalCompositeOperation="destination-over";x.fillStyle="#fff";x.fillRect(0,0,w,h);d=c.toDataURL("image/jpeg",.85)}URL.revokeObjectURL(u);ok(d)}catch(e){er(e)}};im.onerror=()=>{URL.revokeObjectURL(u);er(new Error("formato"))};im.src=u})}
document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
 if(a==="pfimg")$("#pfimgf").click();
 else if(a==="pfimgdel"){const r=cadPerfilR;if(r&&r.imgKey){const id=r.imgKey;await excluirImagem(id);if(IMG_URLS[id]){URL.revokeObjectURL(IMG_URLS[id]);delete IMG_URLS[id]}delete r.imgKey;const prev=$("#pfprev");if(prev)prev.innerHTML=`<span class="mu">Sem imagem</span>`;el.remove();salvar()}}
 else if(a==="pimg")$("#pimgf").click();
 else if(a==="pimgdel"){const p=D.produtos.find(x=>x.id===prodSel);if(p){const id=p.imgKey;if(id){await excluirImagem(id);if(IMG_URLS[id]){URL.revokeObjectURL(IMG_URLS[id]);delete IMG_URLS[id]}}delete p.img;delete p.imgKey;salvar();render()}}});
document.addEventListener("change",async e=>{if(e.target.id!=="pfimgf"||!e.target.files[0])return;const f=e.target.files[0],id=cadPerfilImgId;e.target.value="";if(!id||!cadPerfilR)return;if(f.size>20e6){aviso("Arquivo muito grande (limite de 20 MB).",1);return}try{const data=await reduzir(f),blob=await dataURLBlob(data),r=cadPerfilR,key=r.imgKey||uid();await guardarImagem(key,blob);if(IMG_URLS[key])URL.revokeObjectURL(IMG_URLS[key]);IMG_URLS[key]=URL.createObjectURL(blob);if(r)r.imgKey=key;const prev=$("#pfprev");if(prev)prev.innerHTML=`<img src="${esc(IMG_URLS[key])}" style="max-width:100%;max-height:100%;object-fit:contain">`;const btn=document.querySelector("[data-a=pfimg]");if(btn)btn.textContent="Trocar imagem";if(!document.querySelector("[data-a=pfimgdel]")){const b=document.createElement("button");b.type="button";b.className="sm danger";b.dataset.a="pfimgdel";b.textContent="Remover";btn?.after(b)}salvar()}catch(x){aviso("Não foi possível salvar a imagem do perfil.",1)}return});
document.addEventListener("change",async e=>{if(e.target.id!=="pimgf"||!e.target.files[0])return;const f=e.target.files[0],p=D.produtos.find(x=>x.id===prodSel);e.target.value="";if(!p)return;
 if(f.size>20e6){aviso("Arquivo muito grande (limite de 20 MB). Reduza a imagem e tente de novo.",1);return}
 try{const data=await reduzir(f),blob=await dataURLBlob(data),id=p.imgKey||uid();await guardarImagem(id,blob);if(IMG_URLS[id])URL.revokeObjectURL(IMG_URLS[id]);IMG_URLS[id]=URL.createObjectURL(blob);p.imgKey=id;delete p.img;if(salvar()){aviso("Imagem salva no IndexedDB.")}render()}catch(x){aviso("Não foi possível salvar a imagem no banco local. Tente novamente.",1)}});
const BK={h:null,pend:false,t:null,max:15},BKID="__pasta_backup",ULT="smartpav:ultimoBackup";
const backupOk=()=>typeof window.showDirectoryPicker==="function";
const blobData=b=>new Promise((ok,er)=>{const r=new FileReader();r.onload=()=>ok(r.result);r.onerror=()=>er(r.error);r.readAsDataURL(b)});
async function backupTexto(){const d=JSON.parse(JSON.stringify(D));for(const L of [d.perfis||[],d.produtos||[]])for(const p of L){delete p.img;if(p.imgKey){const rec=await obterImagem(p.imgKey);if(rec&&rec.blob)p.img=await blobData(rec.blob);delete p.imgKey}}return JSON.stringify(d,null,2)}
const stamp=()=>{const d=new Date(),p=n=>String(n).padStart(2,"0");return d.getFullYear()+"-"+p(d.getMonth()+1)+"-"+p(d.getDate())+"_"+p(d.getHours())+"-"+p(d.getMinutes())+"-"+p(d.getSeconds())};
exportarBackup=async function(){try{const t=await backupTexto(),b=new Blob([t],{type:"application/json"}),x=document.createElement("a");x.href=URL.createObjectURL(b);x.download="smartpav_v2_backup_"+stamp()+".json";document.body.appendChild(x);x.click();x.remove();setTimeout(()=>URL.revokeObjectURL(x.href),1000);localStorage.setItem(ULT,String(Date.now()));statusBk()}catch(e){aviso("Falha ao exportar o backup, inclusive imagens.",1)}};
async function permissao(h,pedir){const o={mode:"readwrite"};if((await h.queryPermission(o))==="granted")return true;return pedir&&(await h.requestPermission(o))==="granted"}
async function limparBk(){const L=[];for await(const [n] of BK.h.entries())if(/^smartpav_backup_.*\.json$/.test(n))L.push(n);L.sort();while(L.length>BK.max)await BK.h.removeEntry(L.shift())}
async function gravarBackup(manual){if(!BK.h)return false;
 try{if(!(await permissao(BK.h,manual))){BK.pend=true;statusBk();return false}
  const t=await backupTexto(),n="smartpav_backup_"+stamp()+".json",f=await BK.h.getFileHandle(n,{create:true}),w=await f.createWritable();await w.write(t);await w.close();
  localStorage.setItem(ULT,String(Date.now()));BK.pend=false;try{await limparBk()}catch(e){}statusBk();return n}
 catch(e){BK.pend=true;statusBk();aviso("Não foi possível gravar o backup na pasta. Escolha a pasta de novo em Backup e migração.",1);return false}}
function agendarBk(){if(!BK.h)return;clearTimeout(BK.t);BK.t=setTimeout(()=>gravarBackup(false),60000)}
const _salvar=salvar;salvar=function(){const r=_salvar.apply(this,arguments);if(r)agendarBk();return r};
function statusBk(){let b=$("#bkbar");if(!b||!b.id){b=document.createElement("div");b.id="bkbar";b.style.cssText="position:fixed;top:.8rem;right:1rem;z-index:30;display:none;gap:.6rem;align-items:center;background:var(--sf);color:var(--wn);border:1px solid var(--wn);border-radius:10px;padding:.4rem .7rem;font-size:.88rem";document.body.appendChild(b)}
 const u=+localStorage.getItem(ULT)||0,dias=u?Math.floor((Date.now()-u)/864e5):null;let t="";
 if(BK.h&&BK.pend)t='Backup automático pausado <button class="sm" data-a="bkativar">Ativar</button>';
 else if(!BK.h&&(dias===null||dias>=7))t=(dias===null?"Nenhum backup feito":"Último backup há "+dias+" dias")+' · <a href="#/dados">Configurar</a>';
 b.innerHTML=t;b.style.display=t?"flex":"none"}
function painelBk(){const u=+localStorage.getItem(ULT)||0,dt=u?new Date(u).toLocaleString("pt-BR"):"nunca";
 return `<div class="panel"><h2>Backup automático em pasta</h2>${!backupOk()?'<div class="wn">Este navegador não permite gravar em pasta. Use o Chrome ou o Edge.</div>':`<p class="mu">Escolha uma pasta, de preferência dentro do OneDrive ou Google Drive. O sistema grava uma cópia 1 minuto depois da última alteração e mantém as últimas ${BK.max}. Se o Chrome recusar a pasta, crie uma subpasta (ex.: Documentos\\SmartPAV Backup) e escolha ela.</p><p><b>Pasta:</b> ${BK.h?esc(BK.h.name):"não escolhida"} · <b>Último backup:</b> ${esc(dt)}${BK.pend?' · <span class="wn">pausado: clique em "Gravar agora" para reativar</span>':""}</p><button class="primary" data-a="bkpasta">${BK.h?"Trocar pasta":"Escolher pasta"}</button> ${BK.h?'<button data-a="bkagora">Gravar agora</button> <button class="danger" data-a="bkoff">Desativar</button>':""}`}</div>`}
const _dv=views.dados;views.dados=()=>_dv()+painelBk();
document.addEventListener("click",async e=>{const el=e.target.closest("[data-a]");if(!el)return;const a=el.dataset.a;
 if(a==="bkpasta"){try{const h=await showDirectoryPicker({id:"smartpav-backup",mode:"readwrite",startIn:"documents"});BK.h=h;await imgTx("readwrite",s=>s.put({id:BKID,handle:h}));const n=await gravarBackup(true);if(n)aviso("Pasta definida. Backup gravado: "+n);render()}catch(x){if(x&&x.name!=="AbortError")aviso("O Chrome não aceitou esta pasta. Crie uma subpasta (ex.: Documentos\\SmartPAV Backup) e escolha ela.",1)}}
 else if(a==="bkagora"||a==="bkativar"){const n=await gravarBackup(true);if(n)aviso("Backup gravado: "+n);render()}
 else if(a==="bkoff"){try{await imgTx("readwrite",s=>s.delete(BKID))}catch(x){}clearTimeout(BK.t);BK.h=null;BK.pend=false;statusBk();aviso("Backup automático desativado.");render()}});
(async()=>{try{for(let i=0;i<100&&!imgDb;i++)await new Promise(r=>setTimeout(r,50));const r=imgDb?await obterImagem(BKID):null;BK.h=r&&r.handle||null;if(BK.h&&!(await permissao(BK.h,false)))BK.pend=true}catch(e){}statusBk()})();

const _mig=migrar;migrar=function(o){return garantirCores(_mig(o))};garantirCores(D);
